[package]
name = "sshelf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Visual layer over your ~/.ssh/config: hosts, effective config, tunnels and groups"

[dependencies]
sshconf = { path = "../sshconf" }
sshelf-core = { path = "../sshelf-core" }
# The onboarding tour's ssh: `sshelf --fake-ssh …` runs it (SPEC.md §8).
fake-ssh = { path = "../fake-ssh" }
# Icons come from the bundled Lucide font (src/fonts.rs), so egui's opt-in
# emoji fonts (`monochrome_emoji_fonts`) stay off.
egui = { version = "0.37.0" }
# Linux needs at least one windowing backend once default features are off.
# `clipboard` makes `copy_text` reach the system clipboard (arboard, and
# smithay-clipboard on Wayland) and `links` makes `open_url` open the browser
# (webbrowser): without them egui takes both requests and drops them.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "links",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

# Local wall-clock times ("config reloaded 12:04"); std has no time zones.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Wipes typed passphrases once they are sent (SPEC.md §11).
zeroize = { version = "1.9.1" }
# Tray icon and menu (SPEC.md §10). Native on Windows/macOS; on Linux the
# pure-Rust KSNI (StatusNotifierItem over D-Bus) backend, without GTK.
tray-icon = { version = "0.26.1", default-features = false }
# The root window's raw handle: the Windows frameless fix (src/window.rs,
# `native`) and the parent of system file dialogs (core's `ParentWindow`).
raw-window-handle = { version = "0.6.2" }

[target.'cfg(target_os = "windows")'.dependencies]
# The frameless window's Windows fix (src/window.rs, `native`): DWM
# attributes and a subclass on the root window. The tray menu
# (src/tray_menu.rs, `native`): a window that never activates, closed by
# low-level mouse/keyboard hooks on their own thread. The registry: whether
# the taskbar is light (the monochrome tray icon, src/tray.rs). The console
# `sshelf --version` prints to (main.rs).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The Dock icon with the status dot (src/window.rs, `macos`): winit ignores
# window icons on macOS. The versions eframe uses.
objc2 = { version = "0.6.5" }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSGeometry",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSRunningApplication",
] }

[build-dependencies]
# The .exe's icon and version information (build.rs; Windows targets only).
winresource = { version = "0.1.34" }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[dev-dependencies]
# Headless UI tests: drive views through their accessibility labels.
egui_kittest = { version = "0.37.0", features = ["eframe"] }
tempfile = { version = "3.27.0" }
# examples/iconset.rs and dmg_background.rs: the macOS icon set and the
# .dmg window's background (its caption drawn with the bundled Inter).
png = { version = "0.18.1" }
ab_glyph = { version = "0.2" }
