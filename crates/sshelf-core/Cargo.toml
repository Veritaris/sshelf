[package]
name = "sshelf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sshelf core: data model, storage, ssh discovery, host keys, tunnel supervisor"

[dependencies]
sshconf = { path = "../sshconf" }
directories = { version = "6.0.0" }
humantime = { version = "2.4.0" }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = { version = "3.27.0" }
thiserror = { version = "2.0.21" }
toml = { version = "1.1.8" }
