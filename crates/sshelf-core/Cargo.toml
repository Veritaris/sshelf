[package]
name = "sshelf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sshelf core: data model, storage, ssh discovery, host keys, tunnel supervisor"

[dependencies]
sshconf = { path = "../sshconf" }
directories = { version = "6.0.0" }
humantime = { version = "2.4.0" }
# 9.x is still a release candidate.
notify = { version = "8.2.1" }
# The *Browse…* key file dialog (SPEC.md §10): native on Windows / macOS,
# the xdg desktop portal on Linux (no GTK needed). Async, so macOS runs it
# on the main thread's event loop; `pollster` waits for it on a worker.
pollster = { version = "1.0.1" }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# The app window a file dialog belongs to (it is modal to it).
raw-window-handle = { version = "0.6.2" }
serde = { version = "1.0.229", features = ["derive"] }
# kubectl's `-o json` output (M13: version, kubeconfig, lookups).
serde_json = { version = "1.0.154" }
# Key generation (SPEC.md §11): standard encrypted OpenSSH key files.
# 0.7 is still a release candidate.
ssh-key = { version = "0.6.7", features = ["crypto", "encryption", "getrandom"] }
zeroize = { version = "1.9.1" }
tempfile = { version = "3.27.0" }
thiserror = { version = "2.0.21" }
toml = { version = "1.1.8" }

[target.'cfg(windows)'.dependencies]
# Service Control Manager (read-only `ssh-agent` query), Job Objects
# (stopping a tunnel's whole process tree) and owner-only ACLs for new keys.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# Signals to a whole process group.
libc = { version = "0.2.191" }

[target.'cfg(target_os = "linux")'.dependencies]
# Is a tray host (StatusNotifierWatcher) on the session bus? 5.x is what the
# tray's KSNI backend uses, so it is compiled once.
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
