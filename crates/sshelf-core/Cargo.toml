[package]
name = "sshelf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sshelf core: data model, storage, ssh discovery, host keys, tunnel supervisor"

[dependencies]
sshconf = { path = "../sshconf" }
directories = { version = "6.0.0" }
humantime = { version = "2.4.0" }
# 9.x is still a release candidate.
notify = { version = "8.2.1" }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = { version = "3.27.0" }
thiserror = { version = "2.0.21" }
toml = { version = "1.1.8" }

[target.'cfg(windows)'.dependencies]
# Service Control Manager (read-only `ssh-agent` query) and Job Objects
# (stopping a tunnel's whole process tree).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Services",
] }

[target.'cfg(unix)'.dependencies]
# Signals to a whole process group.
libc = { version = "0.2.191" }
