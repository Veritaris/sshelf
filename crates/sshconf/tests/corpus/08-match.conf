Host normal
    HostName normal.example.com

Match host *.corp user admin
    IdentityFile ~/.ssh/corp_admin

Match exec "test -f ~/.vpn-up" host gw
    ProxyJump vpn-gw

match canonical final host !*.local
    ForwardAgent no

Match originalhost=web localuser root,admin
    User ops

Match all
    ServerAliveInterval 60
