Host "quoted alias" plain
    User "my user"
    IdentityFile "C:\Users\me\.ssh\id with space"
    HostName a"b c"d
    RemoteCommand "tmux new -A -s main"
    ProxyCommand ssh -W "%h:%p" 'jump host' # stays part of the command
    LocalCommand echo "it's \"fine\""
    SetEnv GREETING="hello world" EMPTY=""
    UserKnownHostsFile 'single quoted' "double quoted"
    IdentityAgent path\ with\ escaped\ spaces
