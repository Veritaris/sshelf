name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.target }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Pinned (macos-latest moves on its own); macos-14 images are
          # retired ("configuration … is not supported").
          - os: macos-15
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform.os }}
    # Release builds are slower than CI's; still, a hanging job must stop.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get the release version from the tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Build release binary
        run: cargo build --release -p sshelf --target ${{ matrix.platform.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          bin="sshelf"
          dirname="${bin}-${VERSION}-${{ matrix.platform.target }}"
          mkdir "$dirname"

          if [ "${{ runner.os }}" = "macOS" ]; then
            # sshelf.app with the full icon set, in a .dmg whose window shows
            # it beside an Applications shortcut over a background (dmgbuild
            # writes the layout itself; no Finder scripting). Signed ad hoc
            # only (no Developer ID): Apple Silicon needs a consistent bundle
            # signature.
            cargo run -p sshelf --example iconset -- sshelf.iconset
            iconutil -c icns sshelf.iconset -o sshelf.icns
            app="$dirname/sshelf.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp "target/${{ matrix.platform.target }}/release/${bin}" "$app/Contents/MacOS/"
            cp sshelf.icns "$app/Contents/Resources/"
            sed "s/@VERSION@/${VERSION}/g" crates/sshelf/assets/macos/Info.plist > "$app/Contents/Info.plist"
            codesign --force --deep --sign - "$app"
            cargo run -p sshelf --example dmg_background -- dmg-background
            tiffutil -cathidpicheck dmg-background/background.png dmg-background/background@2x.png -out dmg-background/background.tiff
            python3 -m venv "$RUNNER_TEMP/dmgbuild"
            "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild
            "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s crates/sshelf/assets/macos/dmg-settings.py \
              -D app="$app" -D background="$PWD/dmg-background/background.tiff" \
              "sshelf ${VERSION}" "$dirname.dmg"
            echo "ASSET=$dirname.dmg" >> "$GITHUB_ENV"
          elif [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.platform.target }}/release/${bin}.exe" "$dirname/"
            7z a -t7z "$dirname.7z" "$dirname"
            echo "ASSET=$dirname.7z" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.platform.target }}/release/${bin}" "$dirname/"
            # Desktop entry and icon, laid out like ~/.local/share.
            mkdir -p "$dirname/share/applications" "$dirname/share/icons/hicolor/scalable/apps"
            cp crates/sshelf/assets/linux/sshelf.desktop "$dirname/share/applications/"
            cp crates/sshelf/assets/linux/sshelf.svg "$dirname/share/icons/hicolor/scalable/apps/"
            tar -czf "$dirname.tar.gz" "$dirname"
            echo "ASSET=$dirname.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          append_body: true
          make_latest: true
          files: ${{ env.ASSET }}
