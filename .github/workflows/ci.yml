name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch (or PR) cancels the older run, so only the
# latest commit waits for the scarce macOS runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.platform.target }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Pinned: macos-latest runners failed to provision.
          - os: macos-15
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Check formatting
        if: matrix.platform.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # What the release's .dmg needs, checked before a tag: the icon set
      # converts to .icns, Info.plist is valid, and a .dmg builds with its
      # window layout (here around the debug binary).
      - name: Check the macOS bundle and .dmg
        if: matrix.platform.os == 'macos-15'
        run: |
          t="$RUNNER_TEMP"
          cargo run -p sshelf --example iconset -- "$t/sshelf.iconset"
          iconutil -c icns "$t/sshelf.iconset" -o "$t/sshelf.icns"
          plutil -lint crates/sshelf/assets/macos/Info.plist
          app="$t/stage/sshelf.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/debug/sshelf "$app/Contents/MacOS/"
          cp "$t/sshelf.icns" "$app/Contents/Resources/"
          sed "s/@VERSION@/0.0.0/g" crates/sshelf/assets/macos/Info.plist > "$app/Contents/Info.plist"
          cargo run -p sshelf --example dmg_background -- "$t/bg"
          tiffutil -cathidpicheck "$t/bg/background.png" "$t/bg/background@2x.png" -out "$t/bg/background.tiff"
          python3 -m venv "$t/dmgbuild"
          "$t/dmgbuild/bin/pip" install --quiet dmgbuild
          "$t/dmgbuild/bin/dmgbuild" -s crates/sshelf/assets/macos/dmg-settings.py \
            -D app="$app" -D background="$t/bg/background.tiff" "sshelf check" "$t/check.dmg"
