name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.platform.target }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Pinned: macos-latest runners failed to provision.
          - os: macos-15
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Check formatting
        if: matrix.platform.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # What the release's .app needs, checked before a tag: the icon set
      # converts to .icns and Info.plist is valid.
      - name: Check the macOS bundle files
        if: matrix.platform.os == 'macos-15'
        run: |
          cargo run -p sshelf --example iconset -- "$RUNNER_TEMP/sshelf.iconset"
          iconutil -c icns "$RUNNER_TEMP/sshelf.iconset" -o "$RUNNER_TEMP/sshelf.icns"
          plutil -lint crates/sshelf/assets/macos/Info.plist
